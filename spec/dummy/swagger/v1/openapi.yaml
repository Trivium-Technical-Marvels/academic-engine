---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/academics/academic_timelines":
    get:
      summary: List all academic timelines
      tags:
      - Academic Timelines
      responses:
        '200':
          description: successful for dean
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            start_date:
                              type: string
                              format: date
                            end_date:
                              type: string
                              format: date
                            timeline_type:
                              type: string
                            created_at:
                              type: string
                              format: datetime
                            updated_at:
                              type: string
                              format: datetime
                          required:
                          - id
                          - name
                          - start_date
                          - end_date
                          - timeline_type
                          - created_at
                          - updated_at
                    required:
                    - records
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                required:
                - payload
                - meta
        '403':
          description: forbidden for random user
        '401':
          description: unauthenticated
    post:
      summary: Create an academic timeline
      tags:
      - Academic Timelines
      parameters: []
      responses:
        '201':
          description: created by registrar
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      record:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          start_date:
                            type: string
                            format: date
                          end_date:
                            type: string
                            format: date
                          timeline_type:
                            type: string
                          created_at:
                            type: string
                            format: datetime
                          updated_at:
                            type: string
                            format: datetime
                        required:
                        - id
                        - name
                        - start_date
                        - end_date
                        - timeline_type
                        - created_at
                        - updated_at
                    required:
                    - record
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                required:
                - payload
                - meta
        '403':
          description: forbidden for random user
        '401':
          description: unauthenticated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                timeline_type:
                  type: string
              required:
              - name
              - start_date
              - end_date
              - timeline_type
  "/academics/academic_timelines/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    get:
      summary: Show an academic timeline
      tags:
      - Academic Timelines
      responses:
        '200':
          description: successful for dean
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      record:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          start_date:
                            type: string
                            format: date
                          end_date:
                            type: string
                            format: date
                          timeline_type:
                            type: string
                          created_at:
                            type: string
                            format: datetime
                          updated_at:
                            type: string
                            format: datetime
                        required:
                        - id
                        - name
                        - start_date
                        - end_date
                        - timeline_type
                        - created_at
                        - updated_at
                    required:
                    - record
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                required:
                - payload
                - meta
        '403':
          description: forbidden for random user
        '401':
          description: unauthenticated
        '404':
          description: not found
    put:
      summary: update an academic timeline
      tags:
      - Academic Timelines
      parameters: []
      responses:
        '403':
          description: forbidden for dean
        '200':
          description: updated by registrar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
    delete:
      summary: Delete an academic timeline
      tags:
      - Academic Timelines
      responses:
        '200':
          description: deleted by registrar
        '403':
          description: forbidden for random user
        '401':
          description: unauthenticated
        '404':
          description: not found

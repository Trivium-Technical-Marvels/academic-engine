                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                requirements_schema_attributes:
                  type: object
                  properties:
                    name:
                      type: string
                    schema:
                      type: object
              required:
              - name
              - admission_type
              - start_date
              - end_date

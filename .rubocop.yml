plugins:
- rubocop-rails
- rubocop-performance
- rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2 # or read from .ruby-version
  Exclude:
  - "bin/**/*"
  - "db/schema.rb"
  - "db/migrate/*"
  - "config/**/*"
  - "node_modules/**/*"
  - "vendor/**/*"
  - "tmp/**/*"

  DisplayStyleGuide: true
  SuggestExtensions: false

# =======================
# Layout / Style (Formatting)
# =======================
Layout/LineLength:
  Max: 120
  AllowHeredoc: true
  AllowURI: true

Layout/EndOfLine:
  Enabled: false

Layout/IndentationWidth:
  Width: 2

Layout/EmptyLinesAroundBlockBody:
  Enabled: true

Layout/EmptyLinesAroundClassBody:
  Enabled: true

Layout/EmptyLinesAroundModuleBody:
  Enabled: true

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/ClosingParenthesisIndentation:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: false # don’t force "# frozen_string_literal: true"

Style/Documentation:
  Enabled: true

Style/HashSyntax:
  EnforcedStyle: ruby19

Style/ClassAndModuleChildren:
  Enabled: false # allow Foo::Bar instead of nested class

Style/Output:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false
# =======================
# Metrics (Keep reasonable)
# =======================
Metrics/BlockLength:
  Exclude:
  - "spec/**/*"
  - "test/**/*"
  - "config/routes.rb"

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 35

Metrics/ClassLength:
  Max: 250

Metrics/ModuleLength:
  Max: 250

# =======================
# Rails Cops
# =======================
Rails/SkipsModelValidations:
  Enabled: true

Rails/UniqueValidationWithoutIndex:
  Enabled: true

Rails/Blank:
  Enabled: true

Rails/FindBy:
  Enabled: true

Rails/NegateInclude:
  Enabled: true

Rails/StrongParametersExpect:
  Enabled: false
# =======================
# RSpec Cops
# =======================
RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 7

RSpec/NestedGroups:
  Max: 4

RSpec/DescribeClass:
  Enabled: true

RSpec/MultipleMemoizedHelpers:
  Enabled: false
# =======================
# Performance Cops
# =======================
Performance/Detect:
  Enabled: true

Performance/Count:
  Enabled: true

Performance/RedundantMerge:
  Enabled: true
